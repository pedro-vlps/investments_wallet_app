version: 0.8.0+9

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.1.0
  excel: ^4.0.6
